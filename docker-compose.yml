# Self-hosted Parenthèse: PostgreSQL database, API, front end served by nginx.
# Configuration lives in the .env file next to this one (copy .env.example).
#   docker compose up -d          start
#   docker compose logs -f api    follow the API log
#   docker compose down           stop (the db-data and media volumes are kept)
#   bash tools/docker-smoke.sh    check the installation
# The API and front-end images come from Docker Hub: <IMAGE_NAMESPACE>/parenthese-api and
# parenthese-web, tag IMAGE_TAG (`latest` by default), both set in .env. They are published by
# `make images` or by CI (.github/workflows/images.yml): this file and .env are enough, without the
# code. If an image can't be found, compose builds it from the source (cloned repository);
# `--build` forces that build.

name: parenthese

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parenthese}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-parenthese}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parenthese} -d ${POSTGRES_DB:-parenthese}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE in .env}/parenthese-api:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The whole .env goes to the API (JWT_SECRET, CORS_ORIGIN, session lifetimes).
    env_file: .env
    # These values are set by the Docker deployment and take precedence over .env.
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-parenthese}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-parenthese}
      MEDIA_STORAGE_PATH: /app/storage/media
    volumes:
      - media:/app/storage/media
    # On start, the image applies pending Prisma migrations, then launches the server
    # (CMD in backend/Dockerfile).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First start: migrations run before the API answers. 30 s was not enough, and the web
      # container, which waits for a healthy API, gave up (reported on Reddit on 2026-10-11).
      start_period: 120s

  web:
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE in .env}/parenthese-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        # nginx resolves the `api` address only once, when it starts: it waits for a healthy API,
        # and restarts when the api container is recreated (update), otherwise it would keep the old address.
        condition: service_healthy
        restart: true
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  db-data:
  media:
